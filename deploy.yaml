kind: Deployment
apiVersion: apps/v1
metadata:
  name: veldep
spec:
  replicas: 1
  selector:
    matchLabels:
      env: qa      
  template:
    metadata:
      name: velpod
      labels:
        env: qa
    spec: 
      containers:
        - name: v1
          image: 'httpd'
          ports:
            - containerPort: 80  
          volumeMounts:
            - name: velvol
              mountPath: "/tmp/vel"
        - name: v2 
          image: 'centos:7'
          command: [ "ping", "localhost" ]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: velvol
              mountPath: "/tmp/vel"
      volumes:
        - name: velvol
          hostPath: 
            path: /mnt
