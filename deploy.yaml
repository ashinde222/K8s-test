kind: Deployment
apiVersion: apps/v1
metadata:
  name: veldeploy

spec:
  replicas: 1
  selector:
    matchLabels:
      env: qa

  template:
    metadata:
      name: velpod
      labels:
        env: qa

    spec:
      containers:
        - name: v1
          image: 'httpd'
          ports:
            - containerPort: 80    
      
