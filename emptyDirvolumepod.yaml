kind: Pod
apiVersion: v1
metadata:
  name: velpod


spec:
  containers:
    - name: v1
      image: 'centos:7'
      command: [ "ping", "localhost" ]
      volumeMounts: 
        - name: velvol
          mountPath: "/tmp/velocity"

    - name: v2
      image: 'centos:7'
      command: [ "ping", "localhost" ]
      volumeMounts:
        - name: velvol
          mountPath:  "/tmp/velocity"

  volumes:
    - name: velvol
      emptyDir: { }
      
        
