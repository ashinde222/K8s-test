kind: Pod
apiVersion: v1
metadata:
  name: velpod-1

spec:
  containers:
    - name: v1
      image: 'centos:7'
      command: [ "ping", "localhost" ] 
      volumeMounts:
        - name: velvol
          mountPath: "/tmp/vel"

    - name: v2
      image: 'centos:7'
      command: [ "ping", "localhost" ]
      volumeMounts:
        - name: velvol
          mountPath: "/mnt/vel"


  volumes:
    - name: velvol
      hostPath:
        path: /mnt    
